<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Famille TCG</title>
<style>
  body { background-color: #2c3e50; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
  .board-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; border-bottom: 2px solid #34495e; min-height: 200px; }
  .hand-area { display: flex; justify-content: center; padding: 20px; background-color: #1a252f; min-height: 150px; }
  .ui-bar { display: flex; justify-content: space-between; padding: 10px 20px; background-color: #000; }
  
  /* Style de la Carte */
  .card { width: 120px; height: 180px; background-color: #ecf0f1; color: black; border-radius: 8px; padding: 10px; margin: 0 10px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; border: 4px solid #7f8c8d; transition: transform 0.2s; }
  .card:hover { transform: translateY(-10px); }
  
  /* Raretés */
  .card.rare { border-color: #3498db; } /* Bleu */
  .card.epique { border-color: #9b59b6; } /* Violet */
  .card.legendaire { border-color: #f1c40f; box-shadow: 0 0 15px #f1c40f; } /* Doré simple */

  .card-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; }
  .mana-cost { background-color: #3498db; color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
  .card-stats { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; }
  .stat-attaque { background-color: #e74c3c; color: white; padding: 5px; border-radius: 5px; }
  .stat-vie { background-color: #2ecc71; color: white; padding: 5px; border-radius: 5px; }
</style>
</head>
<body>

  <div class="ui-bar">
    <div id="player-health">Patience : 20</div>
    <div id="player-mana">Mana : 2 / 2</div>
  </div>

  <div class="board-area" id="board">
    <!-- Les cartes jouées apparaîtront ici -->
  </div>

  <div class="hand-area" id="hand">
    <!-- Les cartes en main apparaîtront ici -->
  </div>

<script src="game.js"></script>
</body>
</html>
